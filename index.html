<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ジェーン・ドゥの怪物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;700&family=Gowun+Dodum&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* 夜の子供部屋で「今日を終える」と、朝の光の中で本編が開く。本編は朝の色、忘却が進むほど白紙に近づく */
:root{
  --morning:#eef1f3; --morning-2:#e2e7ec; --sheet:#fbfbfa; --ink:#25233a; --ink-soft:#5a5870; --mute:#8a8a9c;
  --night:#14121d; --night-2:#1d1a29; --moon:#ece4d6;
  --garnet:#b8324a; --aqua:#2aa9a0; --tanz:#6a5fc8; --sun:#f0b25e; --line:#cfd5dc;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --forget:0;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--morning);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.9;letter-spacing:.02em;overflow-x:hidden}
body.locked{overflow:hidden;background:var(--night)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== 入口:夜の子供部屋 ===== */
#entry{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse 60% 50% at 70% 35%,#2a2540 0%,transparent 70%),var(--night);color:var(--moon);display:grid;place-items:center;overflow:hidden;transition:opacity 1.2s}
#entry.gone{opacity:0;pointer-events:none}
.room{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;right:8%;top:12%;width:min(38vw,420px);aspect-ratio:4/5;border:10px solid #3a3446;border-radius:4px;overflow:hidden;background:linear-gradient(#1b2350 0%,#3a3f78 55%,#55507e 62%,#2b3560 63%,#1c2448 100%);box-shadow:0 0 120px rgba(160,170,255,.12)}
.win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;background:#3a3446}
.win::after{content:"";position:absolute;top:44%;left:0;right:0;height:8px;background:#3a3446}
.moon{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;background:#f4eedc;left:62%;top:22%;box-shadow:0 0 40px 12px rgba(244,238,220,.35)}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 4s infinite ease-in-out}
@keyframes tw{50%{opacity:.25}}
.curtain{position:absolute;top:8%;width:11%;height:76%;background:linear-gradient(90deg,#2b2638,#3a3349 50%,#2b2638);opacity:.85;border-radius:0 0 30% 30%}
.floor{position:absolute;left:0;right:0;bottom:0;height:18%;background:#0f0d16}
.bed{position:absolute;left:6%;bottom:14%;width:min(44vw,520px);height:min(14vw,150px);background:#221e2e;border-radius:12px 12px 6px 6px}
.bed::before{content:"";position:absolute;left:4%;top:-26%;width:24%;height:40%;background:#ece4d6;opacity:.18;border-radius:30px}
.bed::after{content:"";position:absolute;left:30%;right:0;top:-8%;height:40%;background:#3a3046;border-radius:10px}
.bag{position:absolute;left:52%;bottom:16%;width:min(7vw,74px);aspect-ratio:3/4;background:#5b1f2b;border-radius:10px 10px 6px 6px;opacity:.75}
.entry-in{position:relative;z-index:2;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--hand);letter-spacing:.14em;font-size:.95rem;opacity:.75}
.title{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,6.6vw,4.6rem);line-height:1.2;margin:.3em 0 .15em;letter-spacing:.04em}
.title .nw{white-space:nowrap;display:inline-block}
.title .dot{color:var(--garnet)}
.en{font-family:var(--display);letter-spacing:.34em;font-size:clamp(.8rem,1.6vw,1rem);opacity:.6;text-transform:uppercase}
.sleep-btn{margin-top:2.6rem;display:inline-flex;align-items:center;gap:.8rem;padding:.95rem 2rem;border-radius:999px;border:1px solid rgba(236,228,214,.45);background:rgba(236,228,214,.08);color:var(--moon);font-family:var(--display);font-size:1.15rem;letter-spacing:.15em;transition:background .3s,border-color .3s}
.sleep-btn:hover{background:rgba(236,228,214,.16);border-color:var(--moon)}
.sleep-btn svg{width:20px;height:20px}
.sound-note{margin-top:1rem;font-size:.82rem;opacity:.55;font-family:var(--hand)}
.skip-in{margin-top:.6rem;background:none;border:0;color:var(--moon);opacity:.5;font-size:.82rem;text-decoration:underline;text-underline-offset:3px}

/* ===== 眠りの暗転 ===== */
#sleep{position:fixed;inset:0;z-index:60;background:#000;color:#d9d2c4;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 1.4s}
#sleep.on{opacity:1;pointer-events:auto}
#sleep.wake{background:#fff;transition:background 1.6s,opacity 1.6s}
.lines{font-family:var(--display);font-size:clamp(1rem,2.4vw,1.3rem);line-height:2.4;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lines p{margin:0;opacity:0;transform:translateY(6px);transition:opacity 1.2s,transform 1.2s}
.lines p.on{opacity:1;transform:none}
.lines p.out{opacity:0;transition:opacity .8s}
.lines .voice{color:#3a3650}
#sleep .skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:1px solid rgba(217,210,196,.3);color:#d9d2c4;border-radius:999px;padding:.35rem 1rem;font-size:.8rem;opacity:.6}

/* ===== 本編 ===== */
#app{min-height:100vh;padding-bottom:110px;position:relative}
#app::after{content:"";position:fixed;inset:0;pointer-events:none;background:#fff;opacity:calc(var(--forget) * .075);transition:opacity 1.2s;z-index:20}
#app .page{filter:saturate(calc(1 - var(--forget) * .08));transition:filter 1.5s}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(238,241,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body:not(.locked)::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--morning)}
.top .wrap{display:flex;align-items:center;gap:1.2rem;min-height:60px}
.brand{font-family:var(--display);font-weight:800;font-size:1.1rem;white-space:nowrap;color:var(--ink);text-decoration:none}
.brand .dot{color:var(--garnet)}
nav.tabs{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--ink-soft);font-size:.92rem;padding:.4rem .8rem;border-radius:999px}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--sheet);box-shadow:inset 0 -2px 0 var(--garnet)}
.view{padding-block:clamp(40px,7vw,80px)}
.view[hidden]{display:none}
.label{font-family:var(--hand);font-size:.85rem;letter-spacing:.18em;color:var(--mute);display:flex;align-items:center;gap:.8em}
.label::before{content:"";width:28px;height:3px;background:repeating-linear-gradient(to right,var(--garnet) 0 8px,transparent 8px 14px)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.3rem);line-height:1.5;margin:.4em 0 .9em;text-wrap:balance}
.lead{font-size:1.06rem;max-width:36em}
.lead p{margin:0 0 1.3em}
.say{font-family:var(--hand);font-size:1.1rem;padding-left:1em;border-left:3px solid var(--aqua)}
.voice-line{font-family:var(--display);color:var(--ink-soft)}
.voice-line b{font-weight:500;color:var(--mute);margin-right:.4em}

/* あらすじ */
.story-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(28px,5vw,64px);align-items:start}
.photo{background:#fff;padding:12px 12px 50px;box-shadow:0 14px 34px rgba(37,35,58,.16);position:relative;max-width:100%;margin:0}
.photo img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
.photo figcaption{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-family:var(--hand);color:var(--ink-soft)}
.photo::after{content:"";position:absolute;top:-13px;left:50%;width:86px;height:26px;margin-left:-43px;background:rgba(207,213,220,.7);transform:rotate(-3deg)}
.tilt-l{transform:rotate(-2.5deg)}.tilt-r{transform:rotate(2.5deg)}

/* 街 */
.town{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(24px,4vw,48px);align-items:start}
.map{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--sheet);box-shadow:0 14px 34px rgba(37,35,58,.12)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;gap:.1rem;background:none;border:0;padding:.2rem;color:var(--ink)}
.pin .ico{width:clamp(38px,5.4vw,54px);height:clamp(38px,5.4vw,54px);border-radius:50%;background:var(--sheet);border:2px solid var(--ink);display:grid;place-items:center;font-size:clamp(1.1rem,2.4vw,1.5rem);box-shadow:0 4px 0 rgba(37,35,58,.18);transition:transform .2s}
.pin span{white-space:nowrap;font-family:var(--hand);font-size:clamp(.72rem,1.4vw,.9rem);background:rgba(251,251,250,.85);padding:0 .4em;border-radius:4px}
.pin:hover .ico{transform:translateY(-3px)}
.pin[aria-pressed="true"] .ico{border-color:var(--garnet);box-shadow:0 0 0 4px rgba(184,50,74,.18),0 4px 0 rgba(37,35,58,.18)}
.place{background:var(--sheet);border-radius:6px;padding:1.4rem 1.4rem 1.5rem;min-height:100%;box-shadow:0 14px 34px rgba(37,35,58,.08)}
.place h3{font-family:var(--display);font-size:1.5rem;margin:0 0 .6rem}
.place p{margin:0 0 1rem}
.place .hint{font-family:var(--hand);color:var(--mute)}
.place.dusk{background:linear-gradient(170deg,#fde2c2,#f4b98d 70%,#e79a7c);}

/* 人物 */
.cast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(36px,6vw,80px)}
.person{display:grid;gap:1.6rem;align-content:start}
.person .photo{max-width:380px}
.person h3{font-family:var(--display);font-size:1.6rem;margin:0;font-weight:700}
.person h3 small{display:block;font-family:var(--hand);font-size:.85rem;color:var(--mute);letter-spacing:.15em;font-weight:400}
.person p{margin:0 0 .8rem}
.person .line{font-family:var(--hand);font-size:1.06rem;padding-left:1em}
.person.jd .line{border-left:3px solid var(--garnet)}
.person.tz .line{border-left:3px solid var(--tanz)}
.person.tz h3 small{color:var(--tanz)}
.tag{display:inline-flex;flex-direction:column;gap:.25rem;background:#fff;border:1.5px solid #b8ae9c;border-radius:6px;padding:.6rem .9rem .7rem;transform:rotate(-2deg);position:relative;margin-top:.6rem;max-width:100%}
.tag::before{content:"";position:absolute;top:-11px;left:50%;width:30px;height:12px;margin-left:-15px;background:#b8ae9c;border-radius:3px 3px 0 0}
.tag label{font-family:var(--hand);font-size:.75rem;letter-spacing:.3em;color:var(--mute)}
.tag input{font-family:var(--hand);font-weight:600;font-size:1.35rem;border:0;border-bottom:1.5px dashed #b8ae9c;background:transparent;color:var(--ink);width:min(14em,64vw);padding:.05em 0;outline:none}
.tag-note{font-family:var(--hand);color:var(--ink-soft);font-size:.92rem;min-height:1.8em;margin-top:.6rem}

/* 遊び方 */
.howto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,72px)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:1.3rem;counter-reset:s}
.steps li{display:grid;grid-template-columns:2.4rem 1fr;gap:.8rem}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--garnet);line-height:1.2}
.steps b{display:block;font-weight:700}
.steps span{color:var(--ink-soft);font-size:.95rem}
.forget-tbl{background:var(--sheet);border-radius:6px;padding:1.2rem 1.3rem;box-shadow:0 14px 34px rgba(37,35,58,.08)}
.forget-tbl h3{font-family:var(--display);font-size:1.25rem;margin:0}
.forget-tbl>p{margin:.1rem 0 1rem;color:var(--mute);font-size:.9rem}
.forget-tbl ol{list-style:none;margin:0;padding:0;display:grid;gap:.1rem}
.forget-tbl li{display:grid;grid-template-columns:1.6rem 1fr;gap:.6rem;font-size:.9rem;line-height:1.7;border-radius:4px;padding:0 .3rem}
.forget-tbl li i{font-style:normal;font-family:var(--display);color:var(--aqua);font-variant-numeric:tabular-nums}
.forget-tbl li.now{background:rgba(184,50,74,.1)}
.fine{font-size:.85rem;color:var(--mute);margin-top:1.4rem}

/* 主題歌 */
.song-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem 1.2rem}
.song-head h2{margin-bottom:0}
.song-en{font-family:var(--display);color:var(--mute);letter-spacing:.2em;font-size:.9rem}
.song-cap{font-family:var(--hand);color:var(--ink-soft);margin:.5rem 0 2rem}
.lyrics{list-style:none;margin:0;padding:0;display:grid;gap:.2rem;max-width:40em}
.lyrics button{display:block;width:100%;text-align:left;background:none;border:0;padding:.35rem .6rem;border-radius:6px;font-family:var(--display);font-size:1.05rem;color:var(--mute);transition:color .4s,background .4s}
.lyrics button:hover{background:var(--sheet)}
.lyrics button.cur{color:var(--ink);background:var(--sheet);box-shadow:inset 3px 0 0 var(--garnet)}
.lyrics .gap{height:.9rem}

/* ===== 下の帯:ステータスウィンドウ兼プレイヤー ===== */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(37,35,58,.95);color:#ece9f2;padding-bottom:env(safe-area-inset-bottom,0px)}
#dock[hidden]{display:none}
.dock-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.9rem;align-items:center;min-height:68px;padding-block:.5rem}
.pp{width:44px;height:44px;border-radius:50%;border:0;background:#ece9f2;color:var(--ink);display:grid;place-items:center}
.pp svg{width:17px;height:17px}
.dock-mid{min-width:0}
.dock-lyric{font-family:var(--display);font-size:.98rem;min-height:1.6em;line-height:1.45}
.dock-lyric>*{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-lyric.idle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-lyric .tr{font-family:var(--body);font-size:.78rem;color:#b9b6c8}
.lyrics .tr{display:block;font-family:var(--body);font-size:.85rem;color:var(--mute);margin-top:.1rem}
.lyrics .tr[hidden],.dock-lyric .tr[hidden]{display:none}
.kara span{display:inline-block;white-space:pre;transition:color .18s,text-shadow .3s}
.kara span{--pop:#ff6b81}
.dock-lyric .kara span,.lyrics button.cur .kara span{will-change:transform;backface-visibility:hidden}
.lyrics .kara span{--pop:#c4394f}
.dock-lyric .kara{padding-top:.4em;margin-top:-.4em}
.kara.enter span{animation:drop .45s cubic-bezier(.2,1.4,.5,1) backwards;animation-delay:calc(var(--k) * 16ms)}
@keyframes drop{from{opacity:0;transform:translateY(.25em) scale(.9)}}
@keyframes hop{0%{transform:none}35%{transform:translateY(-.19em) scale(1.11);color:var(--pop)}70%{transform:translateY(.02em) scale(.985)}100%{transform:none}}
.dock-lyric .kara span{color:#8f8ca3}
.dock-lyric .kara span.lit{color:#7fd0ea}
.dock-lyric.held .kara span{color:#8f8ca3;text-shadow:none}
@keyframes lyrIn{from{opacity:0;transform:translateY(6px)}}
.lyrics button.cur .kara span{color:var(--mute)}
.lyrics button.cur .kara span.lit{color:#1f86a8}
.lyrics button.held .kara span{color:var(--mute)}
.kara span.lit{animation:hop .42s cubic-bezier(.3,1.5,.5,1)}
.dock-lyric.held .kara span.lit,.lyrics button.held .kara span.lit{animation:none}
#entry{background:#0e1020 url(img/entry.webp) 70% center/cover no-repeat}
#entry::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(12,12,24,.9) 0%,rgba(12,12,24,.72) 28%,rgba(12,12,24,.18) 55%,rgba(12,12,24,0) 72%)}
#entry .room{display:none}
@media (min-width:761px){#entry .entry-in{max-width:42vw}#entry .title{font-size:clamp(2.2rem,4.6vw,3.6rem)}}
@media (max-width:760px){#entry{background-position:74% center}#entry::before{background:linear-gradient(180deg,rgba(12,12,24,.5) 0%,rgba(12,12,24,.78) 45%,rgba(12,12,24,.6) 100%)}}
.cta{display:inline-flex;align-items:center;gap:.6rem;margin-top:1.6rem;padding:.75rem 1.5rem;border-radius:999px;background:var(--ink);color:var(--sheet);text-decoration:none;font-family:var(--display);letter-spacing:.08em}
.cta:hover{background:var(--garnet)}
.cta svg{width:14px;height:14px}
.backbtn{background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);font-size:.8rem;padding:.25rem .7rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.35rem;flex:none}
.backbtn svg{width:13px;height:13px}
footer a{color:var(--ink)}
.dock-lyric.idle{color:#a8a5b8;font-family:var(--hand)}
.bar{position:relative;height:16px;cursor:pointer;touch-action:none;margin-top:.1rem}
.bar::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:rgba(236,233,242,.2)}
.bar .fill{position:absolute;left:0;top:7px;height:2px;width:0;background:repeating-linear-gradient(to right,#e0566c 0 7px,transparent 7px 11px)}
.status{display:flex;align-items:center;gap:.6rem;font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.status .sw{background:rgba(255,255,255,.08);border-radius:6px;padding:.25rem .6rem}
.remember{background:none;border:1px solid rgba(236,233,242,.4);color:#ece9f2;border-radius:999px;padding:.2rem .8rem;font-size:.8rem}
.remember[hidden]{display:none}
#blank{position:fixed;inset:0;z-index:45;display:grid;place-items:center;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#blank[hidden]{display:none}
#blank p{font-family:var(--display);font-size:clamp(1.1rem,2.6vw,1.5rem);color:var(--ink-soft);margin:0 0 1.4rem}
#blank button{border:1px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.6rem 1.6rem;font-family:var(--display)}
footer{padding-block:40px;border-top:1px solid var(--line);font-size:.85rem;color:var(--mute)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}

@media (min-width:761px){#entry{place-items:center start}.entry-in{text-align:left;margin-left:7vw}}
@media (max-width:760px){
  .story-grid,.town,.cast,.howto{grid-template-columns:minmax(0,1fr)}
  .story-grid .photo{max-width:300px}
  .brand{display:none}
  nav.tabs{margin-left:0}
  .status .where{display:none}
  .backbtn span{display:none}
  .backbtn{padding:.35rem .5rem}
  .win{width:58vw;right:-6%;top:6%}
  .bed{width:70vw}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html[lang="ko"]{--display:"Noto Serif KR","Nanum Myeongjo",serif;--hand:"Gowun Dodum","Noto Sans KR",sans-serif;--body:"Noto Sans KR","Malgun Gothic",sans-serif}
html[lang="zh-Hant"]{--display:"Noto Serif TC","PMingLiU",serif;--hand:"Noto Sans TC",sans-serif;--body:"Noto Sans TC","Microsoft JhengHei",sans-serif}
html[lang="zh-Hans"]{--display:"Noto Serif SC","SimSun",serif;--hand:"Noto Sans SC",sans-serif;--body:"Noto Sans SC","Microsoft YaHei",sans-serif}
html[lang="en"]{--display:"Shippori Mincho B1",Georgia,serif;--hand:"Klee One",sans-serif;--body:"Zen Kaku Gothic New",system-ui,sans-serif}
html[lang="en"] .title{letter-spacing:.01em}
html[lang="en"] [data-t="t2"],html[lang="ko"] [data-t="t2"]{margin-left:.28em}
html[lang="en"] .title [data-t="t2"],html[lang="ko"] .title [data-t="t2"]{margin-left:0}
html[lang="en"] .title [data-t="t1"]::after,html[lang="ko"] .title [data-t="t1"]::after{content:"\00a0"}
/* 言語 */
.langs{display:flex;gap:.15rem;flex-wrap:nowrap}
.langs button{background:none;border:0;padding:.25rem .45rem;border-radius:4px;font-size:.78rem;letter-spacing:.06em;color:inherit;opacity:.55}
.langs button[aria-pressed="true"]{opacity:1;box-shadow:inset 0 -2px 0 var(--garnet)}
.entry-langs{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:3;color:var(--moon)}
.top .langs{color:var(--ink);flex:none}
/* 崩れる */
.sand{display:inline-block;white-space:pre}
.sandw{display:inline-block;white-space:nowrap}
.crumble .sand{animation:sand 1.3s cubic-bezier(.55,0,.8,.4) forwards;animation-delay:var(--d)}
@keyframes sand{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0;filter:blur(2px)}}
.crumble .dust{animation:dust 1.6s ease-in forwards;animation-delay:var(--d)}
@keyframes dust{to{transform:translateY(40px) scale(.98);opacity:0;filter:blur(10px) saturate(0)}}
.fadeout{transition:opacity 1.6s 1.4s,filter 1.6s 1.4s!important;opacity:0!important;filter:blur(6px)}
#blank{background:#fff;opacity:0;transition:opacity 1s}
#blank.show{opacity:1}
#blank p,#blank button{opacity:0;transform:translateY(6px);transition:opacity 1.4s,transform 1.4s}
#blank.show p{opacity:1;transform:none;transition-delay:.6s}
#blank.show button{opacity:1;transform:none;transition-delay:1.8s}
</style>
</head>

  segs.forEach((sg,j)=>{if(j>0)chars.push({c:'　',t:null});const st=sg[0]-LEAD,nx=j<segs.length-1?segs[j+1][0]-LEAD:L[0]-LEAD,cs=[...sg[1]],n=cs.length,d=Math.min(nx-st,n*0.3+0.25);
    cs.forEach((c,k)=>chars.push({c,t:/[\s　]/.test(c)?null:st+d*k/n}))});
  return {s:segs[0][0]-LEAD,e:L[0]-LEAD,t:segs.map(x=>x[1]).join('　'),chars}});

let entered=false,sleepTimers=[];
function showApp(view,instant){
  entered=true;document.body.classList.remove('locked');
  const en=$('#entry');en.classList.add('gone');if(instant)en.hidden=true;else setTimeout(()=>en.hidden=true,1300);
  $('#app').hidden=false;$('#dock').hidden=false;
  route(view||'story');startForgetClock();
}
function sleepSequence(){
  const sl=$('#sleep'),ps=$$('#lines p');sl.hidden=false;sl.classList.remove('wake');ps.forEach(p=>p.classList.remove('on','out'));void sl.offsetWidth;sl.classList.add('on');
  const at=[700,2500,4600,6300,7300];
  ps.forEach((p,i)=>sleepTimers.push(setTimeout(()=>p.classList.add('on'),at[i])));
  sleepTimers.push(setTimeout(()=>{ps.forEach(p=>p.classList.add('out'));sl.classList.add('wake')},8200));
  // 暗転しきったら、その裏で入口を消して本編に切り替えておく
  sleepTimers.push(setTimeout(()=>showApp('story',true),1600));
  sleepTimers.push(setTimeout(()=>sl.classList.remove('on'),9000));
  sleepTimers.push(setTimeout(()=>{sl.hidden=true},10700));
}
$('#sleepBtn').addEventListener('click',()=>{au.currentTime=0;playSafe();sleepSequence()});
$('#quietBtn').addEventListener('click',()=>showApp('story'));
$('#skipBtn').addEventListener('click',()=>{sleepTimers.forEach(clearTimeout);const sl=$('#sleep');sl.classList.remove('on');sl.hidden=true;if(!au.paused&&au.currentTime<8.5)au.currentTime=8.5;if(!entered)showApp('story',true)});
document.body.classList.add('locked');

function backToStart(){
  if(crumbled)remember();
  sleepTimers.forEach(clearTimeout);sleepTimers=[];au.pause();
  entered=false;document.body.classList.add('locked');
  $('#app').hidden=true;$('#dock').hidden=true;
  const e=$('#entry');e.hidden=false;requestAnimationFrame(()=>e.classList.remove('gone'));
  history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0);
}
$('#backBtn').addEventListener('click',backToStart);

let curView='story';
function route(v){
  if(!VIEWS.includes(v))v='story';curView=v;
  $$('.view').forEach(s=>s.hidden=s.dataset.view!==v);
  $$('nav.tabs a').forEach(a=>a.getAttribute('href')==='#'+v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);
  window.scrollTo(0,0);garbleView();
}
window.addEventListener('hashchange',()=>{if(entered&&!crumbled)route(location.hash.slice(1))});

// ---------- 忘却 ----------
const RATE=[0,0,.012,.025,.04,.06,.085,.11,.15,.2];
function rnd(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function hash(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
const ORIG=new WeakMap(),KEEP=/[\s「」『』、。，．・…！？!?（）()“”"'’,.;:—\-0-9]/;
function textNodes(root){const out=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||!n.nodeValue.trim())return 2;if(p.closest('.jd-name,.jd-cap,.tag,.song-head,.lyrics,.pin .ico'))return 2;return 1}});let n;while(n=w.nextNode())out.push(n);return out}
function allText(root){const out=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){return n.nodeValue.trim()&&!n.parentElement.closest('svg,.ico')?1:2}});let n;while(n=w.nextNode())out.push(n);return out}
function garbleView(){
  const v=document.querySelector('.view[data-view="'+curView+'"]');if(!v)return;
  const rate=RATE[forget];
  textNodes(v).forEach(n=>{let o=ORIG.get(n);if(o==null||(n.nodeValue!==o&&!n.__g)){o=n.nodeValue;ORIG.set(n,o)}
    if(!rate){n.nodeValue=o;n.__g=false;return}
    const r=rnd(hash(o)+forget*131);n.nodeValue=[...o].map(ch=>KEEP.test(ch)||r()>rate?ch:T.moji[Math.floor(r()*T.moji.length)]).join('');n.__g=true});
}
let forget=0,crumbled=false;
function paintAll(){
  document.documentElement.style.setProperty('--forget',Math.min(forget,8));
  $('#fNow').textContent=forget;$('#fgP').textContent=T.fg_p.replace('{n}',forget);
  $$('#forgetList li').forEach(li=>li.classList.toggle('now',+li.dataset.i===forget));
  $('#rememberBtn').hidden=forget===0;
  $('#where').textContent='📍'+PLACE_ICON[here]+T.pl[here][0]+'｜';
  paintName();garbleView();
}
function addForget(k=1){if(crumbled)return;forget=Math.min(9,forget+k);paintAll();if(forget>=9)crumble()}
function remember(){
  if(crumbled){crumbled=false;$$('.crumble-clone').forEach(c=>c.remove());$$('.view').forEach(v=>v.style.visibility='');
    $$('header.top,#dock,footer').forEach(e=>e.classList.remove('fadeout'));const b=$('#blank');b.classList.remove('show');setTimeout(()=>b.hidden=true,1000)}
  forget=0;paintAll();
}
$('#rememberBtn').addEventListener('click',remember);$('#blankBtn').addEventListener('click',remember);
let clock=null;function startForgetClock(){if(clock)return;clock=setInterval(()=>{if(!document.hidden&&forget<8)addForget()},80000)}

// 9:さらさらと崩れる
function crumble(){
  crumbled=true;const v=document.querySelector('.view[data-view="'+curView+'"]'),b=$('#blank');
  if(reduce){b.hidden=false;b.classList.add('show');return}
  const c=v.cloneNode(true);c.classList.add('crumble-clone');c.removeAttribute('data-view');c.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  v.after(c);v.style.visibility='hidden';c.style.position='absolute';c.style.left='0';c.style.right='0';c.style.top=v.offsetTop+'px';
  const vh=innerHeight,y0=scrollY,R=rnd(Date.now());let count=0;
  const delay=el=>{const r=el.getBoundingClientRect();const top=Math.max(0,Math.min(1,(r.top)/vh));return (top*1.6+R()*0.9).toFixed(2)+'s'};
  allText(c).forEach(n=>{
    const parts=n.nodeValue.match(/\s+|[A-Za-z’'\-]+|[\s\S]/gu)||[];const f=document.createDocumentFragment();
    parts.forEach(p=>{if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));return}
      const mk=ch=>{const s=document.createElement('span');s.className='sand';s.textContent=ch;s.style.setProperty('--dx',((R()-.5)*50).toFixed(0)+'px');s.style.setProperty('--dy',(40+R()*140).toFixed(0)+'px');s.style.setProperty('--r',((R()-.5)*90).toFixed(0)+'deg');count++;return s};
      if(p.length>1){const w=document.createElement('span');w.className='sandw';[...p].forEach(ch=>w.appendChild(mk(ch)));f.appendChild(w)}else f.appendChild(mk(p))});
    n.replaceWith(f)});
  c.querySelectorAll('.sand').forEach(s=>s.style.setProperty('--d',delay(s)));
  c.querySelectorAll('figure,.map,.tag,.label,.forget-tbl li i,.steps li').forEach(e=>{e.classList.add('dust');e.style.setProperty('--d',delay(e))});
  requestAnimationFrame(()=>c.classList.add('crumble'));
  $$('header.top,#dock,footer').forEach(e=>e.classList.add('fadeout'));
  setTimeout(()=>{b.hidden=false;requestAnimationFrame(()=>b.classList.add('show'))},3400);
}

// ---------- 街 ----------
let here='home',visited=false;
function renderPlace(){
  const el=$('#place');
  if(!visited){el.classList.remove('dusk');el.innerHTML='<h3></h3><p class="hint"></p>';el.querySelector('h3').textContent=T.tw_t;el.querySelector('.hint').textContent=T.tw_hint;return}
  const p=T.pl[here];el.classList.toggle('dusk',here==='beach');
  el.innerHTML='<h3></h3><p></p><p class="voice-line"></p>';
  el.querySelector('h3').textContent=PLACE_ICON[here]+' '+p[0];el.querySelector('p').textContent=p[1];
  const vl=el.querySelector('.voice-line');if(p[2]){vl.innerHTML='<b>「　　」</b><span></span>';vl.querySelector('span').textContent=p[2]}else vl.textContent=p[3];
}
$$('.pin').forEach(b=>b.addEventListener('click',()=>{
  if(crumbled)return;const k=b.dataset.place,moved=k!==here||!visited;here=k;visited=true;
  $$('.pin').forEach(x=>x.setAttribute('aria-pressed',x===b));renderPlace();
  if(moved)addForget();else paintAll();
}));

// ---------- 主題歌 ----------
function audioMsg(m){const d=document.getElementById('dockLyric');if(!d)return;d.textContent=m;d.classList.add('idle');cur=-3}
function playSafe(){const p=au.play();if(p&&p.catch)p.catch(e=>{console.warn('play failed',e);audioMsg('再生できませんでした（'+(e&&e.name||'不明')+'）。もう一度 ▶ を押してください。')})}
au.addEventListener('error',()=>{const c=au.error&&au.error.code;console.warn('audio error',c);audioMsg('曲を読み込めませんでした（エラー '+c+'）。ページを読み込み直してください。')});
au.addEventListener('stalled',()=>console.warn('audio stalled'));
const ll=$('#lyricList');
LINES.forEach((l,i)=>{const li=document.createElement('li');if(i>0&&l.s-LINES[i-1].e>3)li.innerHTML='<div class="gap"></div>';const b=document.createElement('button');b.type='button';b.innerHTML='<span lang="ja" class="kara"></span><small class="tr"></small>';karaHTML(b.firstChild,i);b.addEventListener('click',()=>{au.currentTime=Math.max(0,l.s-0.3);playSafe();kick()});li.appendChild(b);ll.appendChild(li)});
const lyrBtns=$$('#lyricList button');
function paintLyricTr(){const tr=LT[L];lyrBtns.forEach((b,i)=>{const sm=b.querySelector('.tr');sm.textContent=tr?tr[i]:'';sm.hidden=!tr})}
const PLAY='<path d="M5 3l12 7-12 7z" fill="currentColor"/>',PAUSE='<path d="M5 3h3.5v14H5zM11.5 3H15v14h-3.5z" fill="currentColor"/>';
let dur=264.84,cur=-2;
function setPP(){const p=au.paused;$('#ppIcon').innerHTML=p?PLAY:PAUSE;$('#pp').setAttribute('aria-label',p?T.play:T.pause)}
$('#pp').addEventListener('click',()=>au.paused?playSafe():au.pause());
au.addEventListener('play',setPP);au.addEventListener('pause',setPP);
au.addEventListener('loadedmetadata',()=>{if(isFinite(au.duration))dur=au.duration});
au.addEventListener('timeupdate',tick);au.addEventListener('seeked',tick);
// 今の行:歌っている最中の行。間奏では直前の行を薄く残し、曲の前後だけ曲名を出す
function lineAt(t){let last=-1;for(let k=0;k<LINES.length;k++){if(LINES[k].s<=t)last=k;else break}
  if(last<0)return {i:-1,held:false};const l=LINES[last];
  if(t<l.e+0.3)return {i:last,held:false};
  if(last===LINES.length-1&&t>l.e+4)return {i:-1,held:false};
  return {i:last,held:true}}
let heldNow=false;
function tick(){const t=au.currentTime;$('#fill').style.width=Math.min(100,t/dur*100)+'%';$('#bar').setAttribute('aria-valuenow',Math.floor(t));
  const {i,held}=lineAt(t);const d=$('#dockLyric');
  if(i!==cur){cur=i;
    if(i>=0){d.innerHTML='<span lang="ja" class="kara enter"></span><small class="tr"></small>';karaHTML(d.firstChild,i);const tr=LT[L];d.lastChild.textContent=tr?tr[i]:'';d.lastChild.hidden=!tr;d.classList.remove('idle')}
    else{d.textContent=T.dock0;d.classList.add('idle')}
    lyrBtns.forEach((bt,j)=>{bt.classList.toggle('cur',j===i);if(j!==i)bt.firstChild.querySelectorAll('.lit').forEach(x=>x.classList.remove('lit'))});}
  if(held!==heldNow||i!==cur){heldNow=held}d.classList.toggle('held',held);
  lyrBtns.forEach((bt,j)=>bt.classList.toggle('held',j===i&&held));
  light(t)}
function light(t){if(cur<0)return;const tt=t+0.05;
  [$('#dockLyric .kara'),lyrBtns[cur]&&lyrBtns[cur].firstChild].forEach(el=>{if(!el)return;el.querySelectorAll('span[data-time]').forEach(x=>x.classList.toggle('lit',+x.dataset.time<=tt))})}
let raf=0;function loop(){tick();raf=au.paused?0:requestAnimationFrame(loop)}
function kick(){if(!raf)raf=requestAnimationFrame(loop)}
au.addEventListener('play',kick);
function seek(x){const r=$('#bar').getBoundingClientRect();au.currentTime=Math.max(0,Math.min(1,(x-r.left)/r.width))*dur;tick()}
$('#bar').addEventListener('pointerdown',e=>{const bar=$('#bar');bar.setPointerCapture(e.pointerId);seek(e.clientX);const mv=ev=>seek(ev.clientX),up=()=>{bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up)};bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up)});
$('#bar').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){au.currentTime=Math.min(dur,au.currentTime+5);e.preventDefault()}if(e.key==='ArrowLeft'){au.currentTime=Math.max(0,au.currentTime-5);e.preventDefault()}});

// 入口の星
{const w=$('.win');for(let i=0;i<22;i++){const s=document.createElement('i');s.className='star';s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*55)+'%';s.style.animationDelay=(Math.random()*4)+'s';w.appendChild(s)}}

render();
{const h=location.hash.slice(1);if(VIEWS.includes(h))showApp(h)}
</script>
